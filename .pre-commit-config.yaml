repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: pytest
        name: Testes unitários
        entry: poetry run pytest tests/unit/ -q
        language: system
        pass_filenames: false
        types: [python]
